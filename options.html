<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>下载整理 · Smart Download Organizer</title><link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png"><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="root.css"></head>
<body>
  <header class="toolbar" id="toolbar"><div class="toolbar-inner">
    <a class="brand" href="#main" aria-label="Smart Download Organizer"><img class="brand-logo" src="icons/icon-48.png" width="36" height="36" alt=""><span>Smart Download <span class="brand-suffix">Organizer</span></span></a>
    <div class="language-switcher" role="group" aria-label="Language / 语言"><button class="lang-btn active" data-lang="zh">中文</button><button class="lang-btn" data-lang="en">English</button></div>
  </div></header>
  <main id="main" class="container">
    <div id="enabledPanel" class="panel"></div>
    <div id="groups"></div>
    <div id="backupSection"></div>
  </main>
  <div class="save-bar"><div class="save-bar-inner"><p id="saveStatus" role="status"></p><button id="save" class="button primary"></button></div></div>
  <div id="notification" class="notification" role="status" aria-live="polite" inert><span id="notificationText"></span><button id="undo" class="button quiet" hidden></button><button id="dismissNotification" class="button quiet icon-button" aria-label="关闭通知"><span class="material-icon icon-close" aria-hidden="true"></span></button></div>
  <dialog id="typeDialog" class="settings-dialog" aria-labelledby="typeDialogTitle" aria-describedby="typeDialogDescription">
    <div class="dialog-header"><div><h2 id="typeDialogTitle"></h2><p id="typeDialogDescription" class="caption priority-note"></p></div><button id="closeDialog" class="button quiet icon-button" aria-label="关闭弹窗"><span class="material-icon icon-close" aria-hidden="true"></span></button></div>
    <div class="type-manager">
      <aside id="categorySidebar" class="type-sidebar"><button id="addCategory" class="button quiet category-add-row" aria-label="新增分类"><span class="material-icon icon-add" aria-hidden="true"></span><span id="addCategoryLabel">新增分类</span></button><div id="categoryNav"></div></aside>
      <div id="categoryEditor"></div>
    </div>
    <p id="dialogError" class="field-error" role="alert"></p>
    <div class="dialog-footer type-dialog-footer"><button id="cancelDialog" class="button quiet"></button><button id="applyCategories" class="button primary"></button></div>
  </dialog>
  <dialog id="domainDialog" class="settings-dialog" aria-labelledby="domainDialogTitle" aria-describedby="domainDialogDescription">
    <div class="dialog-header"><div><h2 id="domainDialogTitle"></h2><p id="domainDialogDescription" class="caption priority-note"></p></div><button id="closeDomainDialog" class="button quiet icon-button" aria-label="关闭弹窗"><span class="material-icon icon-close" aria-hidden="true"></span></button></div>
    <div class="domain-manager">
      <aside id="domainSidebar" class="domain-sidebar"><button id="addRule" class="button quiet category-add-row" aria-label="新增域名"><span class="material-icon icon-add" aria-hidden="true"></span><span id="addRuleLabel">新增域名</span></button><div id="domainNav"></div><div id="domainSidebarActions" class="domain-sidebar-actions" hidden><button id="undoRule" class="button quiet" hidden></button></div></aside>
      <div id="domainEditor" class="domain-editor"></div>
    </div>
    <p id="domainDialogError" class="field-error" role="alert"></p>
    <div class="dialog-footer domain-dialog-footer"><button id="cancelDomains" class="button quiet"></button><button id="applyDomains" class="button primary"></button></div>
  </dialog>
  <script type="module" src="options.js"></script>
</body></html>
